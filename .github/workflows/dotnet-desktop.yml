# Build, Selbsttest und Auslieferung von TC.TV (WPF/.NET 8).
#
# - baut die Lösung (Release)
# - führt den eingebauten Selbsttest aus (TC.TV.exe --selftest)
# - erzeugt alle vier Auslieferungen (SingleFile/Standalone x64/x86)
# - lädt die EXE-Dateien und das Selbsttest-Protokoll als Artefakte hoch

name: Build & Test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest
    # "contents: write" erlaubt dem GITHUB_TOKEN, beim Tag-Push Tag und Release
    # anzulegen (Standard wäre seit 2023 read-only).
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    env:
      Solution_Name: TCTV.Net.sln
      Project_Path: src\TCTV\TCTV.csproj
      Configuration: Release
      # Ausgabepfad der normalen Builds (Any CPU -> net8.0-windows).
      Build_Output: src\TCTV\bin\Release\net8.0-windows

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --configuration $env:Configuration --no-restore

    # Der Selbsttest baut alle Fenster unsichtbar auf, führt alle eingebauten
    # Prüfungen aus und beendet sich mit Exit-Code 0 (ok) bzw. 1 (ein FEHLER).
    # TC.TV ist eine WinExe-App: deshalb Start-Process -Wait statt "& $exe",
    # damit PowerShell auf das Ende wartet und der Exit-Code ankommt.
    - name: Run self-test
      run: |
        $exe = Join-Path $env:Build_Output 'TC.TV.exe'
        if (-not (Test-Path $exe)) { throw "Build-Ausgabe nicht gefunden: $exe" }

        $dir = Join-Path $env:RUNNER_TEMP 'tctv-selftest'
        if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }

        $proc = Start-Process -FilePath $exe -ArgumentList '--selftest', '--datadir', $dir -PassThru -Wait

        $log = Join-Path $dir 'TC.TV_Workdir\selftest.log'
        if (Test-Path $log) {
            $ok   = @(Select-String -Path $log -Pattern '^OK').Count
            $fail = @(Select-String -Path $log -Pattern '^FEHLER').Count
            Write-Output "Selbsttest: OK=$ok FEHLER=$fail"
            if ($fail -gt 0) {
                Get-Content $log | Where-Object { $_ -like 'FEHLER*' }
            }
            # Protokoll für die Artefakte an einen festen Ort kopieren.
            New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null
            Copy-Item $log 'artifacts\selftest.log' -Force
        }

        if ($proc.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (ExitCode $($proc.ExitCode))" }
        Write-Output "Selbsttest abgeschlossen (ExitCode 0)."

    # Alle vier Auslieferungen wie lokal (tools\publish-singlefile.ps1).
    # Das Skript bricht bei Fehlern ab und prüft, dass genau eine Datei entsteht.
    - name: Publish SingleFile x64
      run: ./tools/publish-singlefile.ps1 -Variant SingleFile -Architecture x64

    - name: Publish SingleFile x86
      run: ./tools/publish-singlefile.ps1 -Variant SingleFile -Architecture x86

    - name: Publish Standalone x64
      run: ./tools/publish-singlefile.ps1 -Variant Standalone -Architecture x64

    - name: Publish Standalone x86
      run: ./tools/publish-singlefile.ps1 -Variant Standalone -Architecture x86

    # Alle vier Auslieferungen heissen TC.TV.exe (nur in anderen Ordnern).
    # Für das Release werden sie mit eindeutigen Namen in "release/" abgelegt,
    # damit sie als separate Downloads in einem Release stehen können.
    - name: Prepare release files
      run: |
        New-Item -ItemType Directory -Path 'release' -Force | Out-Null
        Copy-Item 'dist\TC.TV.exe'               'release\TC.TV-win-x64.exe'           -Force
        Copy-Item 'dist\x86\TC.TV.exe'           'release\TC.TV-win-x86.exe'           -Force
        Copy-Item 'dist\standalone\TC.TV.exe'    'release\TC.TV-win-x64-standalone.exe' -Force
        Copy-Item 'dist\standalone\x86\TC.TV.exe' 'release\TC.TV-win-x86-standalone.exe' -Force
        Get-ChildItem 'release' | ForEach-Object { Write-Output ("  {0,-34} {1,12:N0} B" -f $_.Name, $_.Length) }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TC.TV
        path: |
          release
          artifacts\selftest.log
        if-no-files-found: error

    # Bei einem Tag-Push (z.B. "v1.0.0") ein GitHub-Release anlegen und jede EXE
    # als eigenen Download-Anhang veröffentlichen. Auf Push/Pull-Request läuft
    # dieser Schritt nicht.
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release/*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

